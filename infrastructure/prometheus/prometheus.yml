global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: logistics-platform
    environment: local

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [ 'localhost:9090' ]

  - job_name: api-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [ 'api-gateway:8080' ]
    relabel_configs:
      - source_labels: [ __address__ ]
        target_label: instance
        replacement: api-gateway

  - job_name: auth-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [ 'auth-service:8081' ]

  - job_name: order-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [ 'order-service:8082' ]

  - job_name: inventory-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [ 'inventory-service:8083' ]

  - job_name: shipment-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [ 'shipment-service:8084' ]

  - job_name: warehouse-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [ 'warehouse-service:8085' ]

  - job_name: notification-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [ 'notification-service:8086' ]

  - job_name: analytics-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [ 'analytics-service:8087' ]

  - job_name: postgres
    static_configs:
      - targets: [ 'postgres-exporter:9187' ]

  - job_name: redis
    static_configs:
      - targets: [ 'redis-exporter:9121' ]

  - job_name: kafka
    static_configs:
      - targets: [ 'kafka-exporter:9308' ]
