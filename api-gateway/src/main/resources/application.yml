server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      discovery:
        locator:
          enabled: false          # Routes are defined programmatically in GatewayConfig
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
      httpclient:
        connect-timeout: 5000
        response-timeout: 30s

  # Redis for rate limiting
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      password: ${SPRING_REDIS_PASSWORD:redis_secret}
      timeout: 2000ms

# JWT configuration
app:
  jwt:
    secret: ${APP_JWT_SECRET:logistics-platform-super-secret-key-change-in-production-min-256-bits}
    expiration-ms: 3600000
    refresh-expiration-ms: 604800000

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,gateway
  endpoint:
    health:
      show-details: always
    gateway:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

# SpringDoc — aggregates Swagger UIs from all downstream services
springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    urls:
      - name: Auth Service
        url: /api/v1/auth/v3/api-docs
      - name: Order Service
        url: /api/v1/orders/v3/api-docs
      - name: Inventory Service
        url: /api/v1/inventory/v3/api-docs
      - name: Shipment Service
        url: /api/v1/shipments/v3/api-docs
      - name: Warehouse Service
        url: /api/v1/warehouses/v3/api-docs
      - name: Analytics Service
        url: /api/v1/analytics/v3/api-docs

# Circuit breaker
resilience4j:
  circuitbreaker:
    instances:
      auth-cb:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
      order-cb:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
      inventory-cb:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
      shipment-cb:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s

logging:
  level:
    com.logistics.gateway: DEBUG
    org.springframework.cloud.gateway: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%X{correlationId}] %logger{36} - %msg%n"

---
spring:
  config:
    activate:
      on-profile: docker

  data:
    redis:
      host: redis
      port: 6379
      password: redis_secret
